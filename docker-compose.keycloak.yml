services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: sahai-openldap
    environment:
      LDAP_ORGANISATION: SahAI
      LDAP_DOMAIN: sahai.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-change-me-ldap-admin}
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  postgres:
    image: postgres:16
    container_name: sahai-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-pg}
    volumes:
      - pg_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: sahai-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-keycloak-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-pg}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_started
      openldap:
        condition: service_started

volumes:
  ldap_data:
  ldap_config:
  keycloak_data:
  pg_data:
