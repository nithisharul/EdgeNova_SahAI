services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: sahai-openldap
    environment:
      LDAP_ORGANISATION: SahAI
      LDAP_DOMAIN: sahai.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-change-me-ldap-admin}
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    volumes:
      - /var/lib/ldap
      - /etc/ldap/slapd.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: sahai-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-keycloak-admin}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      openldap:
        condition: service_started
